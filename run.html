<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Чекпоинт — Спринт</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .next-location-box {
      background: rgba(255,215,0,0.05);
      border: 2px dashed var(--yellow);
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      text-align: center;
    }
    .next-location-box .arrow { font-size: 2rem; color: var(--yellow); animation: pulse 1.5s ease-in-out infinite; }
    .next-location-box .location-name { font-size: 1.2rem; color: var(--yellow); font-weight: 700; margin: 0.5rem 0; }
    .next-location-box .location-desc { color: var(--text-dim); font-size: 0.85rem; }
    .blocked-overlay {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 50vh; text-align: center;
    }
    .blocked-overlay .big-icon { font-size: 4rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div id="quest-timer" class="timer"></div>
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-dot red"></div>
        <div class="terminal-dot yellow"></div>
        <div class="terminal-dot green"></div>
        <span class="terminal-title" id="term-title">checkpoint@loading...</span>
      </div>
      <div class="terminal-body">
        <div id="progress"></div>
        <div id="checkpoint-content">
          <div class="text-center text-dim pulse" style="padding:3rem 0">⟳ Валидация токена...</div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <script src="js/checkpoints.js"></script>
  <script>
    const API = window.location.origin;

    const DIGITS = [4, 2, 1, 3, 0];

    function formatTime(ms) {
      const t = Math.floor(ms / 1000);
      const m = Math.floor(t / 60);
      const s = t % 60;
      const cs = Math.floor((ms % 1000) / 10);
      return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(cs).padStart(2,"0")}`;
    }

    function renderProgress(current, total) {
      const el = document.getElementById("progress");
      if (!el) return;
      total = total || 5;
      let steps = "";
      for (let i = 0; i < total; i++) {
        const cls = i < current ? "completed" : i === current ? "active" : "";
        steps += `<div class="progress-step ${cls}">${i < current ? "✓" : i+1}</div>`;
      }
      el.innerHTML = `
        <div class="progress-label"><span>Прогресс</span><span>${current} / ${total}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${current/total*100}%"></div></div>
        <div class="progress-steps">${steps}</div>`;
    }

    function renderPasswordDisplay(digits) {
      const el = document.getElementById("password-display");
      if (!el) return;
      el.innerHTML = Array.from({length:5}, (_, i) => {
        const filled = digits[i] !== undefined;
        return `<div class="password-digit ${filled?"filled":""}">${filled ? digits[i] : "?"}</div>`;
      }).join("");
    }

    let _timerRAF = null;
    function startTimer(startTime) {
      const el = document.getElementById("quest-timer");
      if (!el) return;
      (function tick() {
        el.innerHTML = `<div class="timer-label">Время</div><div>${formatTime(Date.now()-startTime)}</div>`;
        _timerRAF = requestAnimationFrame(tick);
      })();
    }

    (async function () {
      const token = localStorage.getItem("quest_token");
      if (!token) { location.href = "start.html"; return; }

      const params = new URLSearchParams(location.search);

      try {
        const res = await fetch(API + "/api/progress?token=" + token);
        if (!res.ok) { location.href = "start.html"; return; }
        const data = await res.json();

        const order = data.order;
        const completed = data.completed;
        const currentIndex = data.current_index;
        const startTime = new Date(data.session.started_at).getTime();

        startTimer(startTime);

        // Find which checkpoint this QR is for
        const cpParam = params.get("cp");
        let targetCp = null;
        if (cpParam !== null) {
          targetCp = parseInt(cpParam);
        } else {
          // Scan token itself contains checkpoint info — try the URL
          // Actually we need to know which checkpoint the user scanned
          // The QR URL is start.html?cp=N, so cp is in the URL
          // But we're on run.html now... we need the checkpoint from somewhere
          // Let's use the progress endpoint to determine what to show
        }

        // If we got here from a QR scan (via start.html?cp=N redirect),
        // the checkpoint is the next expected one
        if (targetCp !== null) {
          // Validate this is the right checkpoint
          if (order[currentIndex] !== targetCp) {
            if (completed.includes(targetCp)) {
              showAlreadyDone(targetCp, order.indexOf(targetCp));
            } else {
              showTooEarly(targetCp, order.indexOf(targetCp), currentIndex, order);
            }
            return;
          }

          // Scan this checkpoint via API
          const scanRes = await fetch(API + "/api/scan", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({token, checkpoint_id: targetCp}),
          });
          const scanData = await scanRes.json();

          if (!scanData.ok) {
            showBlocked(scanData.error);
            return;
          }

          showCurrentCheckpoint(targetCp, order.indexOf(targetCp), order, data.nickname, startTime);
        } else {
          // No checkpoint specified — show "scan QR" prompt
          if (currentIndex >= 5) {
            location.href = "finish.html";
            return;
          }
          const nextCp = order[currentIndex];
          const cp = CHECKPOINTS[nextCp];
          renderProgress(currentIndex);
          document.getElementById("term-title").textContent = "checkpoint@" + nextCp + "@waiting-for-scan";
          document.getElementById("checkpoint-content").innerHTML = `
            <div class="blocked-overlay">
              <div class="big-icon">📷</div>
              <div class="title">Отсканируй QR-код</div>
              <div class="text-dim mt-1">Следующая точка: ${cp.emoji} ${cp.title}</div>
              <div class="text-dim">${cp.location}</div>
              <div class="mt-2 text-xs text-dim">Ищи QR-код на локации</div>
            </div>`;
        }

      } catch (e) {
        document.getElementById("checkpoint-content").innerHTML =
          '<div class="blocked-overlay"><div class="big-icon">⚠</div><div class="title">Ошибка сервера</div><div class="text-dim">' + e.message + '</div></div>';
      }

      function showCurrentCheckpoint(cpId, seqIndex, order, nickname, startTime) {
        const cp = CHECKPOINTS[cpId];
        const isLast = seqIndex === 4;
        const nextCpId = isLast ? null : order[seqIndex + 1];
        const nextCp = nextCpId !== null ? CHECKPOINTS[nextCpId] : null;

        renderProgress(seqIndex);
        document.getElementById("term-title").textContent = "checkpoint-" + String(cpId+1).padStart(2,"0") + "@scan-confirmed";

        document.getElementById("checkpoint-content").innerHTML = `
          <span class="checkpoint-num">${String(cpId+1).padStart(2,"0")}</span>
          <div class="flex items-center gap-2 mb-1">
            <span style="font-size:1.8rem">${cp.emoji}</span>
            <div class="title" style="font-size:1.5rem">${cp.title}</div>
          </div>
          <div class="status status-success">✓ QR-код принят!</div>
          <div class="code-block mt-2">
            <div><span class="comment">${cp.codeComment}</span></div>
            <div>${cp.codeLine}</div>
          </div>
          <div class="riddle"><em>«${cp.riddle}»</em></div>
          <div class="digit-display">
            <div class="text-xs text-dim mb-1">ЦИФРА ПАРОЛЯ #${seqIndex+1}:</div>
            <div id="digit" class="digit">?</div>
          </div>
          <div class="separator"></div>
          <div class="text-xs text-dim mb-1">ПАРОЛЬ СОБИРАЕТСЯ:</div>
          <div id="password-display" class="password-display"></div>
          <div class="separator"></div>
          <div id="next-area" style="opacity:0;transition:opacity 0.6s">
            ${isLast
              ? `<div class="next-location-box"><div class="arrow">🏁</div><div class="location-name">ВСЕ КОММИТЫ СОБРАНЫ!</div><div class="location-desc">Беги к организатору.</div><div class="mt-2"><a href="finish.html" class="btn btn-primary glow">→ git push</a></div></div>`
              : `<div class="next-location-box"><div class="arrow">⬇</div><div class="riddle" style="border:none;background:none;padding:0;margin:0;text-align:center">«${nextCp.riddle}»</div><div class="mt-1 text-xs text-dim">Ищи QR-код</div></div>`}
          </div>
          <div class="text-center mt-2"><span class="hint-toggle" id="reset-btn" style="font-size:0.7rem">↺ Начать заново</span></div>`;

        setTimeout(() => { document.getElementById("digit").textContent = DIGITS[cpId]; }, 400);

        // Re-fetch progress to show collected digits
        fetch(API + "/api/progress?token=" + localStorage.getItem("quest_token"))
          .then(r => r.json())
          .then(d => {
            const digits = d.completed.map(id => DIGITS[id]);
            renderPasswordDisplay(digits);
          });

        setTimeout(() => { document.getElementById("next-area").style.opacity = "1"; }, 1400);

        // Confetti
        const canvas = document.getElementById("confetti-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = innerWidth; canvas.height = innerHeight;
        const colors = ["#00ff9c","#00d4ff","#ffd700"];
        const pieces = Array.from({length:50}, () => ({
          x:Math.random()*canvas.width, y:Math.random()*canvas.height-canvas.height,
          w:Math.random()*8+4, h:Math.random()*6+3,
          color:colors[Math.floor(Math.random()*colors.length)],
          speed:Math.random()*3+2, angle:Math.random()*360,
          spin:(Math.random()-0.5)*10, drift:(Math.random()-0.5)*2,
        }));
        let f=0;
        (function anim() {
          ctx.clearRect(0,0,canvas.width,canvas.height);
          for(const p of pieces){p.y+=p.speed;p.x+=p.drift;p.angle+=p.spin;
            ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle*Math.PI/180);
            ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
          if(++f<150)requestAnimationFrame(anim);else ctx.clearRect(0,0,canvas.width,canvas.height);
        })();

        document.getElementById("reset-btn").addEventListener("click", () => {
          if (confirm("Сбросить прогресс?")) {
            localStorage.removeItem("quest_token");
            localStorage.removeItem("quest_order");
            location.href = "start.html";
          }
        });
      }

      function showAlreadyDone(cpId, seqIndex) {
        const cp = CHECKPOINTS[cpId];
        renderProgress(0);
        document.getElementById("term-title").textContent = "checkpoint@" + cpId + "@scanned";
        document.getElementById("checkpoint-content").innerHTML = `
          <div class="blocked-overlay">
            <div class="big-icon">✓</div>
            <div class="title">${cp.emoji} ${cp.title}</div>
            <div class="status status-warning mt-2">Уже отсканирован</div>
            <div class="text-dim mt-1">Ищи QR на следующей точке.</div>
          </div>`;
      }

      function showTooEarly(cpId, seqIndex, currentIndex, order) {
        const cp = CHECKPOINTS[cpId];
        renderProgress(currentIndex);
        document.getElementById("term-title").textContent = "checkpoint@" + cpId + "@wrong-order";
        document.getElementById("checkpoint-content").innerHTML = `
          <div class="blocked-overlay">
            <div class="big-icon">🚫</div>
            <div class="title">Неверный порядок!</div>
            <div class="text-dim mt-1">Этот чекпоинт #${seqIndex+1}. Сейчас ты на шаге #${currentIndex+1}.</div>
            <div class="code-block mt-2" style="text-align:left;display:inline-block">
              ${order.map((id,i) => {
                const c = CHECKPOINTS[id];
                const s = i < currentIndex ? "✓" : i === currentIndex ? "▶" : "○";
                const cls = i < currentIndex ? "text-green" : i === currentIndex ? "text-yellow" : "text-dim";
                return `<div class="${cls}">${s} ${c.emoji} ${c.title}</div>`;
              }).join("")}
            </div>
          </div>`;
      }

      function showBlocked(error) {
        document.getElementById("term-title").textContent = "access@denied";
        document.getElementById("checkpoint-content").innerHTML = `
          <div class="blocked-overlay">
            <div class="big-icon">🔒</div>
            <div class="title">Доступ запрещён</div>
            <div class="text-dim mt-1">${error}</div>
            <div class="mt-2"><a href="start.html" class="btn">↺ К началу</a></div>
          </div>`;
      }
    })();
  </script>
</body>
</html>

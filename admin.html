<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ Админ-панель — Спринт</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1.5rem; }
    @media (max-width: 700px) { .admin-grid { grid-template-columns: 1fr; } }
    .admin-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }
    .admin-card h3 { color: var(--green); font-size: 1rem; margin-bottom: 1rem; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .admin-table th { text-align: left; color: var(--text-dim); padding: 0.4rem; border-bottom: 1px solid var(--border); }
    .admin-table td { padding: 0.4rem; border-bottom: 1px solid var(--border); }
    .admin-table tr:hover { background: var(--bg-card-hover); }
    .tag { display:inline-block; padding:0.1rem 0.4rem; border-radius:4px; font-size:0.7rem; margin:0.1rem; }
    .tag-green { background:rgba(0,255,156,0.1); color:var(--green); border:1px solid rgba(0,255,156,0.3); }
    .tag-blue { background:rgba(0,212,255,0.1); color:var(--blue); border:1px solid rgba(0,212,255,0.3); }
    .tag-yellow { background:rgba(255,215,0,0.1); color:var(--yellow); border:1px solid rgba(255,215,0,0.3); }
    .btn-sm { font-size:0.7rem; padding:0.3rem 0.6rem; }
    .status-msg { padding:0.5rem; border-radius:6px; font-size:0.8rem; margin-top:0.5rem; }
    .status-ok { background:rgba(0,255,156,0.1); color:var(--green); }
    .status-err { background:rgba(255,71,87,0.1); color:var(--red); }
    .game-setup { text-align:center; padding:1rem; }
    .game-setup .big-num { font-size:3rem; color:var(--green); font-weight:700; line-height:1; }
    .game-setup .label { font-size:0.8rem; color:var(--text-dim); margin-top:0.3rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-dot red"></div>
        <div class="terminal-dot yellow"></div>
        <div class="terminal-dot green"></div>
        <span class="terminal-title">admin@dashboard</span>
      </div>
      <div class="terminal-body">

        <div class="title" style="font-size:1.5rem">⚙️ Админ-панель</div>
        <div class="subtitle">Управление спринтом</div>

        <!-- Game Setup -->
        <div class="admin-card" style="margin-top:1.5rem">
          <h3>🎮 Настройка игры</h3>
          <div id="game-setup-section">
            <div class="game-setup">
              <div class="text-sm mb-1">Сколько участников?</div>
              <div class="flex items-center justify-center gap-1">
                <input type="number" id="player-count" class="input" value="15" min="1" max="21" style="width:80px; text-align:center; font-size:1.2rem">
                <button id="btn-generate" class="btn btn-primary glow">Сформировать наборы</button>
              </div>
              <div class="text-xs text-dim mt-1">Числа 1-21 будут распределены без повторений</div>
            </div>
          </div>
          <div id="game-generated" style="display:none">
            <div class="flex items-center justify-between mb-2">
              <div class="game-setup">
                <div class="big-num" id="gen-total">0</div>
                <div class="label">слотов</div>
              </div>
              <div class="game-setup">
                <div class="big-num" style="color:var(--yellow)" id="gen-taken">0</div>
                <div class="label">занято</div>
              </div>
              <div class="game-setup">
                <div class="big-num" style="color:var(--blue)" id="gen-available">0</div>
                <div class="label">свободно</div>
              </div>
              <div>
                <button id="btn-reset-game" class="btn btn-sm" style="border-color:var(--red);color:var(--red)">Сбросить игру</button>
              </div>
            </div>
          </div>
        </div>

        <div class="admin-grid">

          <!-- Pool -->
          <div class="admin-card">
            <h3>📋 Наборы номерков (<span id="pool-count">0</span>)</h3>
            <div id="pool-status-bar" class="mb-2"></div>
            <div id="pool-list" style="max-height:400px;overflow-y:auto"></div>
          </div>

          <!-- Sessions -->
          <div class="admin-card">
            <h3>🔑 Сессии (<span id="s-count">0</span>)</h3>
            <div class="flex gap-1 mb-2">
              <button id="s-refresh" class="btn btn-blue btn-sm">⟳ Обновить</button>
            </div>
            <div id="s-list" style="max-height:400px;overflow-y:auto"></div>
          </div>

          <!-- Results -->
          <div class="admin-card">
            <h3>🏆 Результаты (<span id="r-count">0</span>)</h3>
            <div class="flex gap-1 mb-2">
              <button id="r-refresh" class="btn btn-blue btn-sm">⟳ Обновить</button>
              <button id="r-export" class="btn btn-sm">📋 CSV</button>
              <button id="r-clear" class="btn btn-sm" style="border-color:var(--red);color:var(--red)">🗑 Очистить</button>
            </div>
            <div id="r-list" style="max-height:400px;overflow-y:auto"></div>
          </div>

        </div>

        <!-- Checkpoints -->
        <div class="admin-card" style="margin-top:1.5rem">
          <h3>🗺️ Чекпоинты (<span id="cp-count">0</span>)</h3>
          <div class="flex gap-1 mb-2">
            <button id="cp-refresh" class="btn btn-blue btn-sm">⟳ Обновить</button>
            <button id="cp-add" class="btn btn-primary btn-sm">+ Добавить</button>
          </div>
          <div id="cp-list"></div>
        </div>

        <!-- Checkpoint Edit Modal -->
        <div id="cp-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:rgba(0,0,0,0.8);overflow-y:auto">
          <div style="max-width:600px;margin:2rem auto;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:1.5rem">
            <div class="flex items-center justify-between mb-2">
              <h3 style="color:var(--green);margin:0">Редактировать чекпоинт</h3>
              <button id="cp-modal-close" class="btn btn-sm">✕</button>
            </div>
            <input type="hidden" id="cp-edit-id">
            <div class="input-group mb-1">
              <label class="input-label">ID (номер)</label>
              <input type="number" id="cp-edit-id-num" class="input" min="0" max="99">
            </div>
            <div class="input-group mb-1">
              <label class="input-label">Цифра пароля</label>
              <input type="number" id="cp-edit-digit" class="input" min="0" max="9">
            </div>
            <div class="input-group mb-1">
              <label class="input-label">Эмодзи</label>
              <input type="text" id="cp-edit-emoji" class="input" maxlength="4">
            </div>
            <div class="input-group mb-1">
              <label class="input-label">Название</label>
              <input type="text" id="cp-edit-title" class="input">
            </div>
            <div class="input-group mb-1">
              <label class="input-label">Локация (скрыто от игроков)</label>
              <input type="text" id="cp-edit-location" class="input">
            </div>
            <div class="input-group mb-1">
              <label class="input-label">Загадка</label>
              <textarea id="cp-edit-riddle" class="input" rows="3"></textarea>
            </div>
            <div class="input-group mb-1">
              <label class="input-label">Код комментарий</label>
              <input type="text" id="cp-edit-code-comment" class="input">
            </div>
            <div class="input-group mb-1">
              <label class="input-label">Код строка (HTML)</label>
              <input type="text" id="cp-edit-code-line" class="input">
            </div>
            <div class="flex gap-1 mt-2">
              <button id="cp-save" class="btn btn-primary glow">💾 Сохранить</button>
              <button id="cp-delete" class="btn" style="border-color:var(--red);color:var(--red)">🗑 Удалить</button>
              <button id="cp-qr" class="btn" style="border-color:var(--yellow);color:var(--yellow)">📷 QR-код</button>
            </div>
            <div id="cp-qr-preview" class="text-center mt-2" style="display:none"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;

    async function api(path, opts) {
      const res = await fetch(API + path, opts);
      return res.json();
    }

    function showMsg(el, text, ok) {
      el.innerHTML = '<div class="status-msg ' + (ok ? 'status-ok' : 'status-err') + '">' + text + '</div>';
      setTimeout(() => el.innerHTML = '', 4000);
    }

    function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

    // ---- Game Setup ----
    document.getElementById("btn-generate").addEventListener("click", async () => {
      const count = parseInt(document.getElementById("player-count").value);
      if (!count || count < 1 || count > 21) {
        alert("Введите число от 1 до 21");
        return;
      }
      if (!confirm(`Сформировать наборы для ${count} участников? Все текущие данные будут удалены.`)) return;

      const btn = document.getElementById("btn-generate");
      btn.disabled = true;
      btn.textContent = "⟳ Генерация...";

      const res = await api("/api/game/generate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({num_participants: count}),
      });

      btn.disabled = false;
      btn.textContent = "Сформировать наборы";

      if (res.ok) {
        document.getElementById("game-setup-section").style.display = "none";
        document.getElementById("game-generated").style.display = "block";
        loadPool();
      }
    });

    document.getElementById("btn-reset-game").addEventListener("click", async () => {
      if (!confirm("Сбросить игру? Все данные будут удалены.")) return;
      await api("/api/game/clear", {method: "POST"});
      document.getElementById("game-setup-section").style.display = "block";
      document.getElementById("game-generated").style.display = "none";
      loadPool();
      loadResults();
    });

    // ---- Pool ----
    async function loadPool() {
      const [pool, status] = await Promise.all([
        api("/api/game/pool"),
        api("/api/game/status"),
      ]);

      if (status.total > 0) {
        document.getElementById("game-setup-section").style.display = "none";
        document.getElementById("game-generated").style.display = "block";
        document.getElementById("gen-total").textContent = status.total;
        document.getElementById("gen-taken").textContent = status.taken;
        document.getElementById("gen-available").textContent = status.available;
      }

      document.getElementById("pool-count").textContent = pool.length;

      if (!pool.length) {
        document.getElementById("pool-list").innerHTML = '<div class="text-dim text-center" style="padding:1rem">Нет наборов. Начните игру выше.</div>';
        return;
      }

      document.getElementById("pool-list").innerHTML =
        '<table class="admin-table"><tr><th>#</th><th>Номерки</th><th>Участник</th></tr>' +
        pool.map(s => {
          const nums = s.numbers.split(",").map(n => '<span class="tag tag-green">' + n.trim() + '</span>').join("");
          const who = s.nickname
            ? '<span class="tag tag-blue">' + esc(s.nickname) + '</span>'
            : '<span class="tag tag-yellow">свободен</span>';
          return `<tr><td class="text-dim">${s.id}</td><td>${nums}</td><td>${who}</td></tr>`;
        }).join("") + '</table>';
    }

    // ---- Results ----
    async function loadResults() {
      const list = await api("/api/results");
      document.getElementById("r-count").textContent = list.length;
      if (!list.length) {
        document.getElementById("r-list").innerHTML = '<div class="text-dim text-center" style="padding:1rem">Нет результатов</div>';
        return;
      }
      const medals = ["🥇", "🥈", "🥉"];
      document.getElementById("r-list").innerHTML =
        '<table class="admin-table"><tr><th>#</th><th>Имя</th><th>Время</th><th>Пароль</th><th>Номерки</th></tr>' +
        list.map((r, i) =>
          '<tr><td>' + (medals[i] || (i+1)) + '</td><td>' + esc(r.nickname) + '</td><td>' +
          r.time_formatted + '</td><td>' + r.password + '</td><td>' +
          (r.numbers ? r.numbers.split(",").map(n => '<span class="tag tag-green">' + n.trim() + '</span>').join("") : "—") +
          '</td></tr>'
        ).join("") + '</table>';
    }

    document.getElementById("r-refresh").addEventListener("click", loadResults);

    document.getElementById("r-export").addEventListener("click", async () => {
      const list = await api("/api/results");
      if (!list.length) return alert("Нет данных");
      let csv = "\uFEFFМесто,Имя,Время,Пароль,Номерки,Дата\n";
      list.forEach((r, i) => {
        csv += `${i+1},"${r.nickname}",${r.time_formatted},${r.password},"${r.numbers}",${r.created_at}\n`;
      });
      const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sprint-results.csv";
      a.click();
    });

    document.getElementById("r-clear").addEventListener("click", async () => {
      if (!confirm("Удалить ВСЕ результаты?")) return;
      await api("/api/results/clear", {method: "POST"});
      loadResults();
    });

    // ---- Sessions ----
    async function loadSessions() {
      const sessions = await api("/api/admin/sessions");
      document.getElementById("s-count").textContent = sessions.length;
      if (!sessions.length) {
        document.getElementById("s-list").innerHTML = '<div class="text-dim text-center" style="padding:1rem">Нет активных сессий</div>';
        return;
      }
      const medals = ["🥇", "🥈", "🥉"];
      document.getElementById("s-list").innerHTML =
        '<table class="admin-table"><tr><th>#</th><th>Имя</th><th>Номерки</th><th>Статус</th><th></th></tr>' +
        sessions.map((s, i) => {
          const status = s.finished_at
            ? '<span class="tag tag-green">Финишировал</span>'
            : '<span class="tag tag-yellow">В процессе</span>';
          const nums = s.numbers ? s.numbers.split(",").map(n => '<span class="tag tag-green">' + n.trim() + '</span>').join("") : "—";
          return `<tr>
            <td>${i + 1}</td>
            <td>${esc(s.nickname)}</td>
            <td>${nums}</td>
            <td>${status}</td>
            <td><button class="btn btn-sm" style="border-color:var(--red);color:var(--red)" onclick="deleteSession(${s.participant_id}, '${esc(s.nickname)}')">🗑</button></td>
          </tr>`;
        }).join("") + '</table>';
    }

    window.deleteSession = async function(pid, name) {
      if (!confirm(`Удалить сессию ${name}?`)) return;
      await api("/api/admin/delete-session", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({participant_id: pid}),
      });
      loadSessions();
      loadPool();
    };

    document.getElementById("s-refresh").addEventListener("click", loadSessions);

    // ---- Checkpoints ----
    async function loadCheckpoints() {
      const cps = await api("/api/checkpoints");
      document.getElementById("cp-count").textContent = cps.length;
      if (!cps.length) {
        document.getElementById("cp-list").innerHTML = '<div class="text-dim text-center" style="padding:1rem">Нет чекпоинтов</div>';
        return;
      }
      document.getElementById("cp-list").innerHTML =
        '<table class="admin-table"><tr><th>#</th><th></th><th>Название</th><th>Цифра</th><th>Локация</th><th></th></tr>' +
        cps.map(cp =>
          `<tr>
            <td class="text-dim">${cp.id}</td>
            <td>${cp.emoji}</td>
            <td>${esc(cp.title)}</td>
            <td>${cp.digit}</td>
            <td class="text-dim" style="font-size:0.7rem">${esc(cp.location)}</td>
            <td><button class="btn btn-sm" onclick='editCheckpoint(${JSON.stringify(cp).replace(/'/g, "&#39;")})'>✏️</button></td>
          </tr>`
        ).join("") + '</table>';
    }

    window.editCheckpoint = function(cp) {
      document.getElementById("cp-edit-id").value = cp.id;
      document.getElementById("cp-edit-id-num").value = cp.id;
      document.getElementById("cp-edit-digit").value = cp.digit;
      document.getElementById("cp-edit-emoji").value = cp.emoji;
      document.getElementById("cp-edit-title").value = cp.title;
      document.getElementById("cp-edit-location").value = cp.location;
      document.getElementById("cp-edit-riddle").value = cp.riddle;
      document.getElementById("cp-edit-code-comment").value = cp.code_comment || "";
      document.getElementById("cp-edit-code-line").value = cp.code_line || "";
      document.getElementById("cp-qr-preview").style.display = "none";
      document.getElementById("cp-modal").style.display = "block";
    };

    document.getElementById("cp-modal-close").addEventListener("click", () => {
      document.getElementById("cp-modal").style.display = "none";
    });

    document.getElementById("cp-add").addEventListener("click", () => {
      document.getElementById("cp-edit-id").value = "";
      document.getElementById("cp-edit-id-num").value = "";
      document.getElementById("cp-edit-digit").value = "";
      document.getElementById("cp-edit-emoji").value = "📍";
      document.getElementById("cp-edit-title").value = "";
      document.getElementById("cp-edit-location").value = "";
      document.getElementById("cp-edit-riddle").value = "";
      document.getElementById("cp-edit-code-comment").value = "";
      document.getElementById("cp-edit-code-line").value = "";
      document.getElementById("cp-qr-preview").style.display = "none";
      document.getElementById("cp-modal").style.display = "block";
    });

    document.getElementById("cp-save").addEventListener("click", async () => {
      const idVal = document.getElementById("cp-edit-id").value;
      const idNum = parseInt(document.getElementById("cp-edit-id-num").value);
      const data = {
        id: idNum,
        digit: parseInt(document.getElementById("cp-edit-digit").value),
        emoji: document.getElementById("cp-edit-emoji").value || "📍",
        title: document.getElementById("cp-edit-title").value,
        location: document.getElementById("cp-edit-location").value,
        riddle: document.getElementById("cp-edit-riddle").value,
        code_comment: document.getElementById("cp-edit-code-comment").value,
        code_line: document.getElementById("cp-edit-code-line").value,
      };
      if (isNaN(data.id) || !data.title || !data.riddle) {
        alert("Заполни ID, название и загадку");
        return;
      }
      await api("/api/checkpoints/save", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data),
      });
      document.getElementById("cp-modal").style.display = "none";
      loadCheckpoints();
    });

    document.getElementById("cp-delete").addEventListener("click", async () => {
      const id = document.getElementById("cp-edit-id-num").value;
      if (!id && id !== "0") return;
      if (!confirm("Удалить чекпоинт #" + id + "?")) return;
      await api("/api/checkpoints/" + id, { method: "DELETE" });
      document.getElementById("cp-modal").style.display = "none";
      loadCheckpoints();
    });

    document.getElementById("cp-qr").addEventListener("click", () => {
      const id = document.getElementById("cp-edit-id-num").value;
      const preview = document.getElementById("cp-qr-preview");
      preview.style.display = "block";
      preview.innerHTML = '<img src="/api/checkpoints/' + id + '/qr" style="max-width:250px;border-radius:8px;border:1px solid var(--border)"><div class="text-xs text-dim mt-1">Скачай: правый клик → Сохранить</div>';
    });

    document.getElementById("cp-refresh").addEventListener("click", loadCheckpoints);

    loadPool();
    loadResults();
    loadSessions();
    loadCheckpoints();
    setInterval(() => { loadPool(); loadResults(); loadSessions(); }, 5000);
  </script>
</body>
</html>
